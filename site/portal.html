<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk · Cozy Digital</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body data-page="portal">
    <header class="top">
      <a class="brand" href="/"><img src="/brand/cozy-digital-logo.png" alt="" /><span>Cozy <span class="digital">Digital</span></span></a>
      <nav>
        <a href="/portal/agent">Cozy Agent</a>
        <a href="/admin" id="admin-link" hidden>Admin</a>
        <button type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main class="wrap">
      <p class="muted" id="hello">Desk</p>
      <h1>Your <em>films.</em></h1>
      <p class="lede" id="allowance-note"></p>
      <div class="grid" style="margin-top: 1.2rem">
        <section class="card">
          <h2>Request a video</h2>
          <form id="upload-form">
            <label>Kind
              <select name="kind">
                <option value="logo">Logo</option>
                <option value="photo">Product photo</option>
              </select>
            </label>
            <label>Image <input name="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required /></label>
            <button type="submit">Upload</button>
            <p class="error" id="upload-error" role="alert"></p>
          </form>
          <div class="assets" id="assets"></div>
          <form id="request-form">
            <label>Brief <textarea name="brief" required minlength="8" placeholder="Who it is for, what you sell, and the one thing the video should do."></textarea></label>
            <button class="primary" type="submit">Request a video</button>
            <p class="error" id="request-error" role="alert"></p>
          </form>
        </section>
        <aside class="card">
          <p class="muted">Preview allowance</p>
          <p class="allowance" id="credits">–</p>
          <p class="muted">Not a purchased balance. Pricing is still being set, and it will match the client hub when it is.</p>
          <div class="films" id="films" style="margin-top: 1rem"></div>
        </aside>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
