<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Cozy Digital</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body data-page="login">
    <header class="top">
      <a class="brand" href="/"><img src="/brand/cozy-digital-logo.png" alt="" /><span>Cozy <span class="digital">Digital</span></span></a>
    </header>
    <main class="login-card">
      <p class="muted">Sign in</p>
      <h1>Welcome <em>back.</em></h1>
      <p class="lede">Your assets, briefs, and films live here. New to Cozy Digital? Use Google to open an early-access desk.</p>
      <div class="card" style="margin-top: 1.2rem">
        <a class="google" id="google" href="/api/auth/google">Sign in with Google</a>
        <p class="muted" id="google-note" hidden></p>
        <p class="muted" style="text-align: center">or use email</p>
        <form id="email-form">
          <label>Name <input name="name" autocomplete="name" maxlength="80" placeholder="Only needed the first time" /></label>
          <label>Email <input name="email" type="email" autocomplete="username" required placeholder="you@yourbusiness.com" /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
          <p class="error" id="form-error" role="alert"></p>
          <div class="row">
            <button class="primary" type="submit" id="submit">Sign in</button>
            <button type="button" id="register">Create account</button>
          </div>
        </form>
        <div id="dev" hidden>
          <p class="banner">Preview sign-in. This is not Google, and it is labeled so it cannot be mistaken for a real account.</p>
          <div class="row">
            <button type="button" id="dev-client">Enter as preview client</button>
            <button type="button" id="dev-admin">Enter as preview admin</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
